services:
  workshop-hub:
    build:
      context: ../workshop-hub
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      WORKSHOP_PASSWORD: ${WORKSHOP_PASSWORD:-local}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  cap:
    build:
      context: ./cap
      dockerfile: Dockerfile
    ports:
      - "4004:4004"
    environment:
      WORKSHOP_HUB_URL: http://workshop-hub:8080
      WORKSHOP_PASSWORD: ${WORKSHOP_PASSWORD:-local}
    depends_on:
      workshop-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/workshop-hub/$$metadata').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  ui5:
    build:
      context: ./ui5
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      cap:
        condition: service_healthy